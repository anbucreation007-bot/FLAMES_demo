<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AR Flames</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    color:white;
    background:#03152e;
    overflow-x:hidden;
}

/* BACKGROUND */

.background{
    position:fixed;
    inset:0;
    z-index:-1;

    background:
    radial-gradient(circle at 20% 20%,#0878ff55,transparent 30%),
    radial-gradient(circle at 80% 70%,#00c6ff44,transparent 30%),
    #03152e;

    overflow:hidden;
}

.glow{
    position:absolute;
    width:350px;
    height:350px;
    border-radius:50%;
    background:#008cff;
    filter:blur(120px);
    opacity:.3;

    animation:moveGlow 8s infinite alternate;
}

.glow:nth-child(2){
    right:-100px;
    bottom:-100px;
    background:#00eaff;
    animation-delay:2s;
}

@keyframes moveGlow{

    from{
        transform:translate(0,0);
    }

    to{
        transform:translate(150px,80px);
    }

}


/* NAVBAR */

nav{
    height:75px;
    padding:0 8%;

    display:flex;
    align-items:center;
    justify-content:space-between;

    background:rgba(255,255,255,.06);
    backdrop-filter:blur(15px);

    border-bottom:1px solid rgba(255,255,255,.1);
}

.logo{
    font-size:28px;
    font-weight:800;

    text-shadow:
    0 0 10px #00aaff,
    0 0 25px #008cff;
}

.logo span{
    color:#00d9ff;
}

nav ul{
    display:flex;
    list-style:none;
    gap:35px;
}

nav a{
    color:#dceeff;
    text-decoration:none;
}

nav a:hover{
    color:#00d9ff;
}


/* HERO */

.hero{
    min-height:650px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:70px 8%;

    gap:50px;
}

.hero-text{
    max-width:600px;
}

.small-title{
    color:#00d9ff;
    letter-spacing:3px;
    margin-bottom:18px;
}

.hero h1{
    font-size:clamp(45px,6vw,75px);
    line-height:1.05;
    margin-bottom:25px;
}

.hero h1 span{
    color:#00d9ff;

    text-shadow:
    0 0 10px #00d9ff,
    0 0 30px #008cff;
}

.hero p{
    color:#b9d7ef;
    font-size:18px;
    line-height:1.7;
    margin-bottom:30px;
}


/* INPUT */

.input-box{
    display:flex;
    flex-direction:column;
    gap:15px;
    max-width:400px;
}

.input-box input{
    padding:16px 20px;

    border-radius:30px;

    border:1px solid #00d9ff;

    background:rgba(255,255,255,.08);

    color:white;

    outline:none;

    font-size:16px;

    backdrop-filter:blur(10px);
}

.input-box input::placeholder{
    color:#9db9ce;
}

.input-box input:focus{
    box-shadow:
    0 0 15px #00d9ff,
    0 0 30px #008cff55;
}


/* BUTTON */

.main-btn{
    border:none;

    padding:16px 28px;

    border-radius:50px;

    background:
    linear-gradient(
        90deg,
        #008cff,
        #00d9ff
    );

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
    0 0 15px #008cff,
    0 0 35px #008cff55;

    transition:.3s;
}

.main-btn:hover{
    transform:
    translateY(-4px)
    scale(1.03);

    box-shadow:
    0 0 20px #00d9ff,
    0 0 50px #008cff;
}


/* FLAMES CARD */

.flames-area{
    width:390px;
    height:390px;

    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;
}

.frame-glow{
    position:absolute;

    width:330px;
    height:330px;

    border-radius:30px;

    background:#00bfff;

    filter:blur(50px);

    opacity:.35;

    animation:pulse 3s infinite alternate;
}

@keyframes pulse{

    from{
        transform:scale(.9);
        opacity:.25;
    }

    to{
        transform:scale(1.08);
        opacity:.55;
    }

}

.flames-card{
    width:320px;
    height:320px;

    padding:14px;

    border-radius:28px;

    background:
    linear-gradient(
        135deg,
        #00d9ff,
        #0066ff,
        #00d9ff
    );

    box-shadow:
    0 0 20px #00d9ff,
    0 0 60px #0077ff88;

    animation:float 4s ease-in-out infinite;
}

@keyframes float{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-15px);
    }

}

.card-inner{
    width:100%;
    height:100%;

    border-radius:18px;

    background:
    radial-gradient(
        circle,
        #087dcc,
        #061a35 70%
    );

    border:2px solid #ffffff33;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;
}

.card-inner .fire{
    font-size:70px;
    margin-bottom:15px;

    filter:
    drop-shadow(0 0 15px #00d9ff);
}

.card-inner h2{
    font-size:32px;

    text-shadow:
    0 0 15px #00d9ff;
}

.card-inner p{
    margin-top:10px;
    color:#b9eaff;
}


/* RESULT */

.result-section{
    display:none;

    padding:80px 8%;

    text-align:center;
}

.result-section.show{
    display:block;
}

.result-title{
    color:#00d9ff;
    letter-spacing:3px;
}

.result-name{
    margin-top:20px;

    font-size:55px;

    font-weight:bold;

    color:white;

    text-shadow:
    0 0 15px #00d9ff,
    0 0 40px #008cff;
}

.result-description{
    margin:15px auto 30px;

    color:#b9d7ef;

    font-size:18px;
}

.result-box{
    max-width:500px;

    margin:auto;

    padding:35px;

    border-radius:25px;

    background:rgba(255,255,255,.07);

    border:1px solid #00d9ff66;

    box-shadow:
    0 0 30px #008cff44;

    backdrop-filter:blur(15px);
}


/* FOOTER */

footer{
    text-align:center;

    padding:30px;

    color:#8eabc1;

    background:#020e20;

    border-top:
    1px solid #ffffff12;
}


/* MOBILE */

@media(max-width:800px){

    nav{
        padding:0 5%;
    }

    nav ul{
        display:none;
    }

    .hero{
        flex-direction:column;

        text-align:center;

        padding:60px 5%;
    }

    .input-box{
        margin:auto;
    }

    .flames-area{
        width:320px;
        height:320px;
    }

    .flames-card{
        width:270px;
        height:270px;
    }

    .result-name{
        font-size:40px;
    }

}

</style>
</head>


<body>


<!-- BACKGROUND -->

<div class="background">

    <div class="glow"></div>

    <div class="glow"></div>

</div>


<!-- NAVBAR -->

<nav>

    <div class="logo">

        AR <span>Flames</span>

    </div>


    <ul>

        <li>
            <a href="#">Home</a>
        </li>

        <li>
            <a href="#result">Result</a>
        </li>

        <li>
            <a href="#">About</a>
        </li>

    </ul>

</nav>


<!-- HERO -->

<section class="hero">


    <div class="hero-text">


        <div class="small-title">

            ✦ FLAMES LOVE CALCULATOR

        </div>


        <h1>

            Discover Your

            <span>FLAMES</span>

        </h1>


        <p>

            Enter two names and discover your
            FLAMES relationship result.

        </p>


        <div class="input-box">


            <!-- FIRST NAME -->

            <input
                type="text"
                id="name1"
                placeholder="Eg: Anbu"
            >


            <!-- SECOND NAME -->

            <input
                type="text"
                id="name2"
                placeholder="Eg: Ranjini"
            >


            <button
                class="main-btn"
                onclick="calculateFlames()">

                Calculate FLAMES 🔥

            </button>


        </div>

    </div>


    <!-- GLOWING CARD -->

    <div class="flames-area">

        <div class="frame-glow"></div>


        <div class="flames-card">

            <div class="card-inner">

                <div class="fire">
                    🔥
                </div>

                <h2>
                    AR Flames
                </h2>

                <p>
                    Find Your Connection
                </p>

            </div>

        </div>

    </div>

</section>


<!-- RESULT -->

<section
    class="result-section"
    id="result">


    <div class="result-box">


        <div class="result-title">

            ✦ YOUR FLAMES RESULT

        </div>


        <div
            class="result-name"
            id="resultName">
        </div>


        <div
            class="result-description"
            id="resultDescription">
        </div>


        <button
            class="main-btn"
            onclick="resetGame()">

            Try Again 🔄

        </button>


    </div>

</section>


<footer>

    © 2026 AR Flames • Find Your Connection 🔥

</footer>


<script>


/* FLAMES CALCULATION */

function calculateFlames(){

    let name1 =
        document
        .getElementById("name1")
        .value
        .toLowerCase()
        .replace(/[^a-z]/g,"");


    let name2 =
        document
        .getElementById("name2")
        .value
        .toLowerCase()
        .replace(/[^a-z]/g,"");


    if(name1 === "" || name2 === ""){

        alert("Please enter both names!");

        return;

    }


    /* SPECIAL RESULT */

    let result;


    if(
        (name1 === "anbu" && name2 === "ranjini") ||
        (name1 === "ranjini" && name2 === "anbu")
    ){

        result = "Marriage";

    }

    else{

        let a = name1.split("");

        let b = name2.split("");


        /* REMOVE COMMON LETTERS */

        for(
            let i = a.length - 1;
            i >= 0;
            i--
        ){

            let index =
                b.indexOf(a[i]);


            if(index !== -1){

                a.splice(i,1);

                b.splice(index,1);

            }

        }


        let count =
            a.length + b.length;


        /* FLAMES */

        let flames = [

            "Friends",
            "Love",
            "Affection",
            "Marriage",
            "Enemy",
            "Sister"

        ];


        let index = 0;


        while(flames.length > 1){

            index =
                (index + count - 1)
                % flames.length;

            flames.splice(index,1);

        }


        result = flames[0];

    }


    /* RESULT TEXT */

    let descriptions = {

        Friends:
        "You share a friendly and caring connection. 🤝",

        Love:
        "There is a special romantic connection. ❤️",

        Affection:
        "There is warmth, care and affection between you. 🫶",

        Marriage:
        "The FLAMES game gives a marriage connection. 💍",

        Enemy:
        "The FLAMES game gives an enemy result. 😅",

        Sister:
        "The FLAMES game gives a sister-like connection. 👧"

    };


    document
    .getElementById("resultName")
    .textContent = result;


    document
    .getElementById("resultDescription")
    .textContent =
        descriptions[result];


    let resultSection =
        document.getElementById("result");


    resultSection.classList.add("show");


    resultSection.scrollIntoView({
        behavior:"smooth"
    });

}


/* RESET */

function resetGame(){

    document
    .getElementById("name1")
    .value = "";


    document
    .getElementById("name2")
    .value = "";


    document
    .getElementById("result")
    .classList.remove("show");


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}

</script>


</body>
</html>
